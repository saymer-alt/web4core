name: Verify subscription worker deployments
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: link-generators
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List deployments
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/subscription
          wranglerVersion: '4.54.0'
          command: deployments list --name sub
      - name: List versions
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/subscription
          wranglerVersion: '4.54.0'
          command: versions list --name sub
