name: Provider HWID contract

on:
  pull_request:
    branches: [link-generators]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Syntax and runtime bundle
        run: |
          node --check src/build.js
          node --check src/core/mihomo.js
          npm run build:web:runtime
      - name: Synthetic provider HWID regressions
        run: npm run test:provider-hwid
