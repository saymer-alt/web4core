name: Candidate subscription inspection

on:
  push:
    branches: [ feat/subscription-inspection-hwid ]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/subscription-inspection-hwid
      - name: Apply targeted source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/core/subscription.js')
          text = path.read_text()
          old = "async function fetchSubscription(url) {\n    if (typeof fetch !== 'function') throw new Error('Fetch API not available');\n\n    const allowedSchemes = new Set(SUPPORTED_SCHEMES.filter(s => s !== 'http' && s !== 'https'));\n    const splitLines = (text) => (text || '').split(/\\n/).map(s => s.trim()).filter(Boolean);\n    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));\n    const isBrowser = (typeof window !== 'undefined') && (typeof window.document !== 'undefined');\n"
          new = "async function fetchSubscription(url, options = {}) {\n    if (typeof fetch !== 'function') throw new Error('Fetch API not available');\n\n    const allowedSchemes = new Set(SUPPORTED_SCHEMES.filter(s => s !== 'http' && s !== 'https'));\n    const splitLines = (text) => (text || '').split(/\\n/).map(s => s.trim()).filter(Boolean);\n    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));\n    const isBrowser = (typeof window !== 'undefined') && (typeof window.document !== 'undefined');\n    const allowedRequestHeaders = new Set(['x-hwid', 'x-device-model', 'x-device-os', 'x-ver-os']);\n    const requestHeaders = {};\n    if (options && options.headers && typeof options.headers === 'object') {\n        for (const [rawName, rawValue] of Object.entries(options.headers)) {\n            const name = String(rawName || '').trim().toLowerCase();\n            if (!allowedRequestHeaders.has(name) || rawValue === undefined || rawValue === null) continue;\n            const value = String(rawValue).trim();\n            if (value) requestHeaders[name] = value;\n        }\n    }\n"
          if old not in text:
              raise SystemExit('subscription signature anchor not found')
          text = text.replace(old, new, 1)

          old = "            const headers = new Headers((FETCH_INIT && FETCH_INIT.headers) ? FETCH_INIT.headers : {});\n            if (!headers.has('Accept')) headers.set('Accept', 'text/plain, */*');\n            if (!isBrowser) {\n"
          new = "            const headers = new Headers((FETCH_INIT && FETCH_INIT.headers) ? FETCH_INIT.headers : {});\n            if (!headers.has('Accept')) headers.set('Accept', 'text/plain, */*');\n            for (const [name, value] of Object.entries(requestHeaders)) headers.set(name, value);\n            if (!isBrowser) {\n"
          if old not in text:
              raise SystemExit('headers anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('tools/tests/subscription-fetch-headers.test.mjs')
          test_path.write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import { fetchSubscription } from '../../src/core/subscription.js';

const GOOD = 'vless://00000000-0000-0000-0000-000000000001@example.com:443?encryption=none&type=tcp#Synthetic';

function headerValue(init, name) {
    return new Headers(init && init.headers ? init.headers : {}).get(name);
}

async function withFetch(mock, fn) {
    const prevFetch = globalThis.fetch;
    const prevWindow = globalThis.window;
    globalThis.fetch = mock;
    try { return await fn(); }
    finally {
        globalThis.fetch = prevFetch;
        if (prevWindow === undefined) delete globalThis.window;
        else globalThis.window = prevWindow;
    }
}

test('fetchSubscription keeps legacy call free of device headers', async () => {
    await withFetch(async (_url, init) => {
        assert.equal(headerValue(init, 'x-hwid'), null);
        assert.equal(headerValue(init, 'x-device-model'), null);
        return new Response(GOOD, { status: 200 });
    }, async () => {
        assert.equal(await fetchSubscription('https://example.test/sub'), GOOD);
    });
});

test('fetchSubscription forwards only allowlisted device headers', async () => {
    await withFetch(async (_url, init) => {
        assert.equal(headerValue(init, 'x-hwid'), '0123456789abcdef0123456789abcdef');
        assert.equal(headerValue(init, 'x-device-model'), 'Saymer Link Generators Preview');
        assert.equal(headerValue(init, 'x-device-os'), 'Browser');
        assert.equal(headerValue(init, 'authorization'), null);
        return new Response(GOOD, { status: 200 });
    }, async () => {
        const result = await fetchSubscription('https://example.test/sub', { headers: {
            'X-HWID': ' 0123456789abcdef0123456789abcdef ',
            'x-device-model': ' Saymer Link Generators Preview ',
            'x-device-os': 'Browser',
            'Authorization': 'must-not-leave-caller'
        }});
        assert.equal(result, GOOD);
    });
});

test('browser retry keeps the same device identity', async () => {
    let calls = 0;
    await withFetch(async (_url, init) => {
        calls++;
        assert.equal(headerValue(init, 'x-hwid'), 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa');
        if (calls === 1) return new Response('busy', { status: 503, statusText: 'Service Unavailable' });
        return new Response(GOOD, { status: 200 });
    }, async () => {
        globalThis.window = { document: {} };
        assert.equal(await fetchSubscription('https://example.test/sub', { headers: { 'x-hwid': 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' } }), GOOD);
        assert.equal(calls, 2);
    });
});

test('browser fallback request carries the same allowlisted headers', async () => {
    const seen = [];
    await withFetch(async (url, init) => {
        seen.push({ url: String(url), hwid: headerValue(init, 'x-hwid'), model: headerValue(init, 'x-device-model') });
        if (seen.length === 1) throw new TypeError('Failed to fetch');
        return new Response(GOOD, { status: 200 });
    }, async () => {
        globalThis.window = { document: {} };
        const result = await fetchSubscription('https://example.test/sub', { headers: {
            'x-hwid': 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb',
            'x-device-model': 'Saymer Link Generators Preview'
        }});
        assert.equal(result, GOOD);
        assert(seen.length >= 2);
        assert.match(seen[1].url, /^https:\/\/sub\.web2core\.workers\.dev\//);
        assert.equal(seen[1].hwid, 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb');
        assert.equal(seen[1].model, 'Saymer Link Generators Preview');
    });
});
''')
          PY
          git diff --check
          git status --short
      - name: Commit targeted patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/core/subscription.js tools/tests/subscription-fetch-headers.test.mjs; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "candidate-patcher"
          git config user.email "candidate-patcher@users.noreply.github.com"
          git add src/core/subscription.js tools/tests/subscription-fetch-headers.test.mjs
          git commit -m "feat(subscription): support device headers for preview fetch"
          git push origin HEAD:feat/subscription-inspection-hwid

  test:
    needs: patch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/subscription-inspection-hwid
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-fund --no-audit
      - run: node --test tools/tests/subscription-fetch-headers.test.mjs tools/tests/mihomo-exclude-filter.test.mjs tools/tests/mihomo-tun-stack.test.mjs
      - run: npm run build:web:runtime
      - run: node --check src/web4core.runtime.js
      - run: npm run test:amnezia
